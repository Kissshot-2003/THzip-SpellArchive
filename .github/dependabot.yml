version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # 这些依赖的跨大版本 / 0.x 小版本会改 API，必须手动迁移并跑差分测试。
      - dependency-name: zip
        update-types:
          - version-update:semver-major
      - dependency-name: sevenz-rust2
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: lzma-rust2
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: zstd
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: lz4_flex
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: resvg
        update-types:
          - version-update:semver-major
      - dependency-name: rfd
        update-types:
          - version-update:semver-major
      - dependency-name: tray-icon
        update-types:
          - version-update:semver-major
      - dependency-name: criterion
        update-types:
          - version-update:semver-major
      - dependency-name: eframe
        update-types:
          - version-update:semver-major
      - dependency-name: egui
        update-types:
          - version-update:semver-major
      - dependency-name: egui_extras
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
