name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build -p thzip-cli --release

      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml

  differential:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pinned 7-Zip
        shell: pwsh
        run: |
          $exe = ./scripts/install-7zip-ci.ps1
          "THZIP_7Z=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Differential tests
        run: cargo test -p thzip-core --test differential -- --nocapture
