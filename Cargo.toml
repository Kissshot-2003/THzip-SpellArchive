[workspace]
resolver = "3"
members = ["crates/spell-core", "crates/spell-app", "crates/spell-cli"]
default-members = ["crates/spell-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["SpellArchive contributors"]

[workspace.dependencies]
spell-core = { path = "crates/spell-core" }
thiserror = "2"
zeroize = "1"
encoding_rs = "0.8"
windows-sys = "0.61"
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
toml = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "4.6", default-features = false, features = [
    "deflate",
    "deflate-flate2-zlib-rs",
    "deflate64",
    "bzip2",
    "zstd",
    "ppmd",
    "aes-crypto",
] }
crc32fast = "1"
crossbeam-channel = "0.5"
rfd = "0.15"
sevenz-rust2 = { version = "0.20", features = ["deflate", "zstd", "lz4"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.16", features = ["xz", "encoder"] }
zstd = "0.13"
lz4_flex = { version = "0.12", features = ["frame"] }
single-instance = "0.3"
tray-icon = "0.24"
winreg = "0.56"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "none"
