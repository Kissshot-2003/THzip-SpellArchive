[workspace]
resolver = "3"
members = ["crates/thzip-core", "crates/thzip-app", "crates/thzip-cli"]
default-members = ["crates/thzip-app"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
thzip-core = { path = "crates/thzip-core", version = "0.2.2" }
thiserror = "2"
zeroize = "1"
encoding_rs = "0.8"
windows-sys = "0.61"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "clipboard",
    "links",
    "wgpu_no_default_features",
] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
resvg = { version = "0.45", default-features = false, features = [] }
fontdb = "0.24"
regex = "1"
liblzma = { version = "0.4", features = ["static"] }
zip = { version = "9.6", default-features = false, features = [
    "deflate",
    "deflate-flate2-zlib-rs",
    "deflate64",
    "bzip2",
    "zstd",
    "ppmd",
    "aes-crypto",
    # LZMA / XZ 解码器：zip crate 在解析 AES extra field 时会用 0x9901
    # 里记录的真实压缩方法覆盖 method 99，因此「AES + LZMA」这类组合
    # 只有在 crate 自带 LZMA/XZ 解码器时才能解开。用的是项目自己也在
    # 用的 lzma-rust2，不额外引入依赖。
    "lzma",
    "xz",
] }
crc32fast = "1"
sha2 = "0.10"
sha1 = "0.11"
md-5 = "0.10"
hex = "0.4"
crossbeam-channel = "0.5"
rfd = "0.15"
sevenz-rust2 = { version = "0.24.2", features = ["deflate", "zstd", "lz4"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.16", features = ["xz", "encoder"] }
zstd = "0.14"
lz4_flex = { version = "0.14", features = ["frame"] }
# RAR 读取。unrar-rs 是纯 Rust 实现，`copy_to` 能把解码产物直接写进
# 调用方的 writer——零缓冲、零临时文件，天然满足「任意大小条目流式解压」。
#
# 许可：Apache-2.0 + UnRAR 条款（允许解压，禁止用于开发 RAR 兼容压缩器）。
# 默认 feature 走 aws-lc-rs，需要 NASM 才能编译；改用 crypto-rust 走纯 Rust
# 的 aes/cbc/hmac，构建链更简单，也省掉一个 C 依赖。
unrar-rs = { version = "0.15.2", default-features = false, features = ["crypto-rust"] }
single-instance = "0.3"
tray-icon = "0.24"
winreg = "0.56"
libc = "0.2"
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
