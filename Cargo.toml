[workspace]
resolver = "3"
members = ["crates/thzip-core", "crates/thzip-app", "crates/thzip-cli"]
default-members = ["crates/thzip-app"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["THzip-SpellArchive contributors"]

[workspace.dependencies]
thzip-core = { path = "crates/thzip-core" }
thiserror = "2"
zeroize = "1"
encoding_rs = "0.8"
windows-sys = "0.61"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "clipboard",
    "links",
    "wgpu_no_default_features",
] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "parking_lot",
] }
serde = { version = "1", features = ["derive"] }
toml = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
resvg = { version = "0.45", default-features = false, features = [] }
fontdb = "0.23"
regex = "1"
liblzma = { version = "0.4", features = ["static"] }
zip = { version = "4.6", default-features = false, features = [
    "deflate",
    "deflate-flate2-zlib-rs",
    "deflate64",
    "bzip2",
    "zstd",
    "ppmd",
    "aes-crypto",
] }
crc32fast = "1"
crossbeam-channel = "0.5"
rfd = "0.15"
sevenz-rust2 = { version = "0.24.2", features = ["deflate", "zstd", "lz4"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.16", features = ["xz", "encoder"] }
zstd = "0.13"
lz4_flex = { version = "0.12", features = ["frame"] }
unrar-ng = "0.7"
single-instance = "0.3"
tray-icon = "0.24"
winreg = "0.56"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
