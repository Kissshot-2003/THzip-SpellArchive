[package]
name = "thzip-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "thzip-spellarchive"
path = "src/main.rs"

[features]
default = ["accesskit", "svg-text"]

# 屏幕阅读器（Windows UI Automation）支持。关掉约省 3 MiB。
accesskit = ["eframe/accesskit"]

# 自定义 SVG 主题里的文字渲染。需要 usvg 的字体栈（rustybuzz / ttf-parser），
# 关掉约省 1 MiB。内置主题全是 PNG，不受影响。
svg-text = ["resvg/text"]
dhat = ["dep:dhat"]

[dependencies]
thzip-core.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
# 只保留 D3D12 后端。wgpu 默认还会带上 Vulkan / Metal / GLES / WebGPU，
# 其中 Vulkan（ash）单独就占约 4 MiB。需要兜底老显卡或虚拟机时，
# 在下面补 "vulkan" 即可。
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "parking_lot",
] }
serde.workspace = true
toml.workspace = true
image.workspace = true
resvg.workspace = true
fontdb.workspace = true
regex.workspace = true
rfd.workspace = true
single-instance.workspace = true
tray-icon.workspace = true
dhat = { version = "0.3", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # SHChangeNotify：注册表变更后通知资源管理器重读右键菜单
    "Win32_UI_Shell",
    # DPAPI：记住密码
    "Win32_Security_Cryptography",
    # 多显示器可见性校验
    "Win32_Graphics_Gdi",
    # 目标卷文件系统判断（FAT32 单文件上限）
    "Win32_Storage_FileSystem",
] }
winreg.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", default-features = false }
proptest.workspace = true
